name: Test Matrix Contains
on:
  workflow_dispatch:
jobs:
  a:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - run: echo "probe ok"
  b:
    needs: a
    if: always() && contains(needs.a.results, 'success')
    runs-on: ubuntu-latest
    steps:
    - run: echo "CHAIN SHOULD RUN"
  c:
    needs: a
    if: always() && !contains(needs.a.results, 'success')
    runs-on: ubuntu-latest
    steps:
    - run: echo "CHAIN-NEG SHOULD NOT RUN"
