name: Test Contains

on:
  workflow_dispatch:

permissions: write-all

jobs:
  a:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Fail on ubuntu only
      shell: bash
      run: |
        if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
          echo "failing ubuntu leg"
          exit 1
        fi
        echo "macos leg ok"

  b:
    needs: a
    if: always() && contains(needs.a.results, 'success')
    runs-on: ubuntu-latest
    steps:
    - name: B ran
      run: echo "B RAN"
