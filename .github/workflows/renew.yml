name: Renew VPN Subscription

on:
  repository_dispatch:
    types: [renew-trigger]
  workflow_dispatch:

permissions: write-all

jobs:
  renew-selfhosted:
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    - run: pip install requests pyyaml
    - name: Get and update subscription
      env:
        GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        GIST_ID: ${{ secrets.GIST_ID }}
      run: python3 vpn_refresher.py

  renew-ubuntu:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    - run: pip install requests pyyaml
    - name: Get and update subscription
      env:
        GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        GIST_ID: ${{ secrets.GIST_ID }}
      run: python3 vpn_refresher.py

  renew-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    - run: pip install requests pyyaml
    - name: Get and update subscription
      env:
        GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        GIST_ID: ${{ secrets.GIST_ID }}
      run: python3 vpn_refresher.py

  renew-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    - run: pip install requests pyyaml
    - name: Get and update subscription
      shell: pwsh
      env:
        GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        GIST_ID: ${{ secrets.GIST_ID }}
      run: python vpn_refresher.py

  chain:
    needs: [renew-selfhosted, renew-ubuntu, renew-macos, renew-windows]
    if: always() && !cancelled() && (needs.renew-selfhosted.result == 'success' || needs.renew-ubuntu.result == 'success' || needs.renew-macos.result == 'success' || needs.renew-windows.result == 'success')
    runs-on: ubuntu-latest
    steps:
    - name: Chain next run in 14 minutes
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "Waiting 14 minutes before triggering next renewal..."
        sleep 840
        echo "Triggering next renewal..."
        gh api repos/${{ github.repository }}/actions/workflows/renew.yml/dispatches -f ref=main
        echo "Next renewal triggered!"
