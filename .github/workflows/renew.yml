name: Renew VPN Subscription

on:
  repository_dispatch:
    types: [renew-trigger]
  workflow_dispatch:

permissions: write-all

jobs:
  renew:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install Dependencies
      run: pip install requests pyyaml

    - name: Get and update subscription
      env:
        GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        GIST_ID: ${{ secrets.GIST_ID }}
      run: |
        python3 vpn_refresher.py

  chain:
    needs: renew
    if: always() && contains(needs.renew.results, 'success')
    runs-on: ubuntu-latest
    steps:
    - name: Chain next run in 14 minutes
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "Waiting 14 minutes before triggering next renewal..."
        sleep 840
        echo "Triggering next renewal..."
        gh api repos/${{ github.repository }}/actions/workflows/renew.yml/dispatches \
          -f ref=main
        echo "Next renewal triggered!"